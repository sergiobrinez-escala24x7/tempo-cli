[project]
name = "tempo-cli"
version = "0.1.0"
description = "CLI local para registrar worklogs en Tempo/Jira desde la terminal"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "pyyaml>=6.0",
    "rich>=13.0",
    "cryptography>=41.0",
]

[project.scripts]
tempo = "tempo_cli.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
